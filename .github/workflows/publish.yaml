name: Publish

on:
  repository_dispatch:
    types:
      - publish
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bump (e.g. strays)"
        required: true
        type: string
      tag:
        description: "Upstream release tag to publish (e.g. v0.1.0)"
        required: true
        type: string
  # A version is only published once its bump lands on main — a pull request
  # that never merges must not leave a tag pointing at a version this tap does
  # not serve.
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ inputs.formula || github.event.client_payload.formula || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: bump ${{ inputs.formula || github.event.client_payload.formula }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      FORMULA: ${{ inputs.formula || github.event.client_payload.formula }}
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      # A GitHub App token rather than GITHUB_TOKEN: pushes made with
      # GITHUB_TOKEN do not trigger workflows, which would leave the bump pull
      # request without the build verification in tests.yaml.
      - name: Get token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          # Skip token revocation because expired tokens are automatically
          # invalidated by GitHub anyway.
          skip-token-revoke: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Validate dispatch payload
        run: |
          set -euo pipefail

          if [[ ! "${FORMULA}" =~ ^[a-z0-9][a-z0-9@+._-]*$ ]]; then
            echo "::error::invalid formula name: ${FORMULA}"
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::invalid tag: ${TAG}"
            exit 1
          fi
          if [[ ! -f "Formula/${FORMULA}.rb" ]]; then
            echo "::error::no such formula: Formula/${FORMULA}.rb"
            exit 1
          fi

      - name: Update formula
        id: update
        run: |
          set -euo pipefail

          formula_file="Formula/${FORMULA}.rb"
          current_url="$(sed -n 's/^  url "\(.*\)"$/\1/p' "${formula_file}")"
          homepage="$(sed -n 's/^  homepage "\(.*\)"$/\1/p' "${formula_file}")"
          if [[ -z "${current_url}" || -z "${homepage}" ]]; then
            echo "::error::could not read the stable url and homepage from ${formula_file}"
            exit 1
          fi
          echo "homepage=${homepage}" >> "${GITHUB_OUTPUT}"

          # The tag is the last path segment of the release tarball url, so the
          # bump is a substitution on that segment alone. This keeps the rest of
          # the url (host, owner, repo, archive layout) authoritative in the
          # formula instead of reconstructing it here.
          new_url="${current_url%/*}/${TAG}.tar.gz"
          curl --fail --silent --show-error --location --output release.tar.gz "${new_url}"
          new_sha256="$(sha256sum release.tar.gz | cut -d ' ' -f 1)"
          rm release.tar.gz

          sed -i \
            -e "s|^  url \".*\"$|  url \"${new_url}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${new_sha256}\"|" \
            "${formula_file}"

          if git diff --quiet -- "${formula_file}"; then
            echo "::notice::${FORMULA} is already at ${TAG}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HOMEPAGE: ${{ steps.update.outputs.homepage }}
        run: |
          set -euo pipefail

          branch="bump/${FORMULA}-${TAG}"
          version="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit --all --message "chore(${FORMULA}): bump to ${TAG}" \
            --message "Upstream released ${TAG}, so the tap has to point at the new tarball for \`brew upgrade\` to see it."
          git push --set-upstream origin "${branch}"

          body="$(printf '%s\n' \
            "Bumps \`${FORMULA}\` to upstream [\`${TAG}\`](${HOMEPAGE}/releases/tag/${TAG})." \
            "" \
            "Opened automatically by \`.github/workflows/publish.yaml\`.")"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${FORMULA} ${version}" \
            --body "${body}"

          # Auto-merge lets the build verification in tests.yaml gate the bump
          # without a human round trip. It is not fatal when the repository has
          # the setting turned off.
          gh pr merge --auto --squash --delete-branch "${branch}" \
            || echo "::warning::could not enable auto-merge; merge the pull request manually"

  tag:
    name: tag published packages
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Tag published packages
        run: |
          set -euo pipefail

          # Derived from the merged files rather than the branch name: a name
          # like bump/<formula>-<tag> cannot be split reliably once either half
          # contains a hyphen (herdr-worktree-hooks-plugin, v1.0.0-beta.1).
          changed="$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- Formula Casks)"
          if [[ -z "${changed}" ]]; then
            echo "::notice::no formula or cask changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while read -r file; do
            [[ -n "${file}" ]] || continue
            name="$(basename "${file}" .rb)"

            # Casks always carry a `version` stanza. Formulae usually leave it
            # implicit and let Homebrew derive it from the release tarball, whose
            # filename is the last path segment the bump job substitutes.
            version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "${file}")"
            if [[ -z "${version}" ]]; then
              url="$(sed -n 's/^  url "\(.*\)"$/\1/p' "${file}")"
              segment="$(basename "${url}")"
              segment="${segment%.tar.gz}"
              version="${segment#v}"
            fi

            if [[ -z "${version}" ]]; then
              echo "::error::could not determine a version for ${file}"
              exit 1
            fi

            tag="${name}-${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::notice::${tag} already exists"
              continue
            fi

            git tag "${tag}"
            git push origin "refs/tags/${tag}"
            echo "::notice::tagged ${tag}"
          done <<< "${changed}"
