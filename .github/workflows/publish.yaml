name: Publish

on:
  repository_dispatch:
    types:
      - publish
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bump (e.g. strays)"
        required: true
        type: string
      tag:
        description: "Upstream release tag to publish (e.g. v0.1.0)"
        required: true
        type: string
  # A version is only published once its bump lands on main — a pull request
  # that never merges must not leave a tag pointing at a version this tap does
  # not serve.
  pull_request:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ inputs.formula || github.event.client_payload.formula || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    name: bump ${{ inputs.formula || github.event.client_payload.formula }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      FORMULA: ${{ inputs.formula || github.event.client_payload.formula }}
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
    steps:
      # A GitHub App token rather than GITHUB_TOKEN: pushes made with
      # GITHUB_TOKEN do not trigger workflows, which would leave the bump pull
      # request without the build verification in tests.yaml.
      - name: Get token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          # Skip token revocation because expired tokens are automatically
          # invalidated by GitHub anyway.
          skip-token-revoke: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Validate dispatch payload
        run: |
          set -euo pipefail

          if [[ ! "${FORMULA}" =~ ^[a-z0-9][a-z0-9@+._-]*$ ]]; then
            echo "::error::invalid formula name: ${FORMULA}"
            exit 1
          fi
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::invalid tag: ${TAG}"
            exit 1
          fi
          if [[ ! -f "Formula/${FORMULA}.rb" ]]; then
            echo "::error::no such formula: Formula/${FORMULA}.rb"
            exit 1
          fi

      - name: Update formula
        id: update
        run: |
          set -euo pipefail

          formula_file="Formula/${FORMULA}.rb"
          homepage="$(sed -n 's/^  homepage "\(.*\)"$/\1/p' "${formula_file}")"
          current_urls=()
          while IFS= read -r url; do
            current_urls+=("${url}")
          done < <(sed -n 's/^[[:space:]]*url "\(.*\)"$/\1/p' "${formula_file}")
          if [[ -z "${homepage}" || -z "${current_urls[*]:-}" ]]; then
            echo "::error::could not read the stable url and homepage from ${formula_file}"
            exit 1
          fi
          echo "homepage=${homepage}" >> "${GITHUB_OUTPUT}"

          # The tag is the only part of a url a bump touches, so the rest (host,
          # owner, repo, archive layout, platform triple) stays authoritative in
          # the formula instead of being reconstructed here. A release asset
          # carries the tag as a path segment and a versionless filename; a
          # source tarball carries it as the filename itself.
          new_urls=()
          release_base=""
          for url in "${current_urls[@]}"; do
            if [[ "${url}" == */releases/download/*/* ]]; then
              release_base="${url%%/releases/download/*}"
              new_urls+=("${release_base}/releases/download/${TAG}/${url##*/}")
            else
              new_urls+=("${url%/*}/${TAG}.tar.gz")
            fi
          done

          # A release that ships SHA256SUMS has already hashed every archive it
          # published, so one request replaces downloading each archive just to
          # hash it again — which is what a multi-platform formula would
          # otherwise cost. Formulae whose release has no such file (source
          # tarballs, in particular) still fall back to hashing the download.
          checksums=""
          if [[ -n "${release_base}" ]]; then
            checksums="$(curl --fail --silent --location \
              "${release_base}/releases/download/${TAG}/SHA256SUMS" || true)"
          fi

          new_sha256s=()
          for new_url in "${new_urls[@]}"; do
            asset="${new_url##*/}"
            new_sha256=""
            if [[ -n "${checksums}" ]]; then
              new_sha256="$(awk -v asset="${asset}" '$2 == asset { print $1; exit }' <<< "${checksums}")"
            fi
            if [[ -z "${new_sha256}" ]]; then
              curl --fail --silent --show-error --location --output release.asset "${new_url}"
              new_sha256="$(sha256sum release.asset | cut -d ' ' -f 1)"
              rm release.asset
            fi
            new_sha256s+=("${new_sha256}")
          done

          # Rewritten in file order: within a formula every `sha256` belongs to
          # the `url` above it, so the Nth pair is the Nth platform. `sed` alone
          # cannot express that pairing, and it would have to hardcode the
          # indentation of every nested `on_*` block on top.
          paste -d '\t' \
            <(printf '%s\n' "${new_urls[@]}") \
            <(printf '%s\n' "${new_sha256s[@]}") > replacements.tsv
          awk -v version="${TAG#v}" -v replacements=replacements.tsv '
            BEGIN {
              while ((getline line < replacements) > 0) {
                split(line, field, "\t")
                urls[++count] = field[1]
                sha256s[count] = field[2]
              }
            }
            /^[[:space:]]*url "/ { sub(/url ".*"$/, "url \"" urls[++url_index] "\"") }
            /^[[:space:]]*sha256 "/ { sub(/sha256 ".*"$/, "sha256 \"" sha256s[++sha256_index] "\"") }
            /^[[:space:]]*version "/ { sub(/version ".*"$/, "version \"" version "\"") }
            { print }
          ' "${formula_file}" > formula.updated
          mv formula.updated "${formula_file}"
          rm replacements.tsv

          if git diff --quiet -- "${formula_file}"; then
            echo "::notice::${FORMULA} is already at ${TAG}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HOMEPAGE: ${{ steps.update.outputs.homepage }}
        run: |
          set -euo pipefail

          branch="bump/${FORMULA}-${TAG}"
          version="${TAG#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit --all --message "chore(${FORMULA}): bump to ${TAG}" \
            --message "Upstream released ${TAG}, so the tap has to point at the new tarball for \`brew upgrade\` to see it."
          git push --set-upstream origin "${branch}"

          body="$(printf '%s\n' \
            "Bumps \`${FORMULA}\` to upstream [\`${TAG}\`](${HOMEPAGE}/releases/tag/${TAG})." \
            "" \
            "Opened automatically by \`.github/workflows/publish.yaml\`.")"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${FORMULA} ${version}" \
            --body "${body}"

          # Auto-merge lets the build verification in tests.yaml gate the bump
          # without a human round trip. It is not fatal when the repository has
          # the setting turned off.
          gh pr merge --auto --squash --delete-branch "${branch}" \
            || echo "::warning::could not enable auto-merge; merge the pull request manually"

  tag:
    name: tag published packages
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Tag published packages
        run: |
          set -euo pipefail

          # Derived from the merged files rather than the branch name: a name
          # like bump/<formula>-<tag> cannot be split reliably once either half
          # contains a hyphen (herdr-worktree-hooks-plugin, v1.0.0-beta.1).
          changed="$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- Formula Casks)"
          if [[ -z "${changed}" ]]; then
            echo "::notice::no formula or cask changed"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while read -r file; do
            [[ -n "${file}" ]] || continue
            name="$(basename "${file}" .rb)"

            # Casks always carry a `version` stanza. Formulae usually leave it
            # implicit and let Homebrew derive it from the download url, which
            # carries the tag either as the tarball filename or as the release
            # asset's parent directory.
            version="$(sed -n 's/^  version "\(.*\)"$/\1/p' "${file}")"
            if [[ -z "${version}" ]]; then
              url="$(sed -n 's/^[[:space:]]*url "\(.*\)"$/\1/p' "${file}" | head -n 1)"
              case "${url}" in
                */releases/download/*/*)
                  # A prebuilt archive is named after its platform, not its
                  # version; the tag is the path segment above the filename.
                  segment="${url%/*}"
                  segment="${segment##*/}"
                  ;;
                *)
                  segment="$(basename "${url}")"
                  segment="${segment%.tar.gz}"
                  ;;
              esac
              version="${segment#v}"
            fi

            if [[ -z "${version}" ]]; then
              echo "::error::could not determine a version for ${file}"
              exit 1
            fi

            tag="${name}-${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "::notice::${tag} already exists"
              continue
            fi

            git tag "${tag}"
            git push origin "refs/tags/${tag}"
            echo "::notice::tagged ${tag}"
          done <<< "${changed}"
